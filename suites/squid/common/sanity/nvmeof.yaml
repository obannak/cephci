tests:
  - test:
      name: Setup pre-requisites
      desc: Setup packages and configuration for cluster deployment
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: Deploy cluster using cephadm
      desc: Bootstrap and deploy services
      polarion-id: CEPH-83573713
      module: test_cephadm.py
      config:
        steps:
          - config:
              service: cephadm
              command: bootstrap
              args:
                mon-ip: node1
          - config:
              service: host
              command: add_hosts
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              service: osd
              command: apply
              args:
                all-available-devices: true
          - config:
              service: rgw
              command: apply
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw
          - config:
              command: shell
              args:
                - "ceph fs volume create cephfs"
          - config:
              service: mds
              command: apply
              args:
                placement:
                  label: mds
              base_cmd_args:
                verbose: true
              pos_args:
                - cephfs
          - config:
              command: shell
              args:
                - "ceph osd pool create rbd"
          - config:
              command: shell
              args:
                - "rbd pool init rbd"
          - config:
              command: shell
              args:
                - "ceph osd pool create rbd-gw"
          - config:
              command: shell
              args:
                - "rbd pool init rbd-gw"
          - config:
              command: shell
              args:
                - "rbd create -s 1G image1"
          - config:
              command: apply
              service: nvmeof
              args:
                placement:
                  label: nvmeof-gw
              pos_args:
                - rbd-gw
                - gw_group1
      abort-on-fail: true

  - test:
      name: Configure client
      desc: Configure the RGW & RBD clients
      module: test_client.py
      config:
        command: add
        id: client.1
        node: node8
        install_packages:
          - ceph-common
          - rbd-nbd
          - jq
          - fio
        copy_admin_keyring: true
        caps:
          mon: "allow *"
          osd: "allow *"
          mds: "allow *"
          mgr: "allow *"
      abort-on-fail: true

  - test:
      name: Configure client
      desc: Configure the RGW & RBD clients
      module: test_client.py
      config:
        command: add
        id: client.2
        node: node9
        install_packages:
          - ceph-common
          - rbd-nbd
          - jq
          - fio
        copy_admin_keyring: true
        caps:
          mon: "allow *"
          osd: "allow *"
          mds: "allow *"
          mgr: "allow *"
      abort-on-fail: true

  - test:
      name: Basic E2ETest Ceph NVMEoF GW sanity test on dedicated node
      desc: E2E-Test NVMEoF Gateway on dedicated node and Run IOs on targets
      polarion-id: CEPH-83575441
      module: test_ceph_nvmeof_gateway.py
      config:
        gw_node: node6
        rbd_pool: rbd-gw
        gw_group: gw_group1
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd-gw
        install: true                           # Run SPDK with all pre-requisites
        cleanup:
          - subsystems
          - initiators
          - pool
          - gateway
        subsystems:                             # Configure subsystems with all sub-entities
          - nqn: nqn.2016-06.io.spdk:cnode1
            serial: 1
            bdevs:
              count: 1
              size: 10G
            listener_port: 5001
            allow_host: "*"
        initiators:                             # Configure Initiators with all pre-req
          - subnqn: nqn.2016-06.io.spdk:cnode1
            listener_port: 5001
            node: node9
      abort-on-fail: true

  #  Configure Ceph NVMeoF gateway
  #  Configure Initiators
  #  Run IO on NVMe Targets
  - test:
      name: NVMeoF 2-GW HA failover-failback via systemctl
      desc: NVMEoF failover-failback test via systemctl rpm tool
      polarion-id: CEPH-83588636
      module: test_ceph_nvmeof_high_availability.py
      config:
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        gw_group: gw_group1
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        install: true                           # Run SPDK with all pre-requisites
        cleanup:
          - pool
          - gateway
          - initiators
        gw_nodes:
          - node6
          - node7
        subsystems:                             # Configure subsystems with all sub-entities
          - nqn: nqn.2016-06.io.spdk:cnode1
            serial: 1
            bdevs:
            - count: 2
              size: 2G
              lb_group: node6
            listener_port: 4420
            listeners:
              - node6
              - node7
            allow_host: "*"
          - nqn: nqn.2016-06.io.spdk:cnode2
            serial: 2
            bdevs:
            - count: 2
              size: 2G
              lb_group: node7
            listener_port: 4420
            listeners:
              - node6
              - node7
            allow_host: "*"
        initiators:                             # Configure Initiators with all pre-req
          - nqn: connect-all
            listener_port: 4420
            node: node8
        fault-injection-methods:                # Failure induction
          - tool: systemctl
            nodes: node6
      abort-on-fail: true

  - test:
      name: NVMeoF 2-GW HA failover-failback via orchestrator
      desc: NVMEoF failover-failback test via cephadm daemon orchestration
      polarion-id: CEPH-83588699
      module: test_ceph_nvmeof_high_availability.py
      config:
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        gw_group: gw_group1
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        install: true                           # Run SPDK with all pre-requisites
        cleanup:
          - pool
          - gateway
          - initiators
        gw_nodes:
          - node6
          - node7
        subsystems:                             # Configure subsystems with all sub-entities
          - nqn: nqn.2016-06.io.spdk:cnode1
            serial: 1
            bdevs:
            - count: 2
              size: 2G
              lb_group: node6
            listener_port: 4420
            listeners:
              - node6
              - node7
            allow_host: "*"
          - nqn: nqn.2016-06.io.spdk:cnode2
            serial: 2
            bdevs:
            - count: 2
              size: 2G
              lb_group: node7
            listener_port: 4420
            listeners:
              - node6
              - node7
            allow_host: "*"
        initiators:                             # Configure Initiators with all pre-req
          - nqn: connect-all
            listener_port: 4420
            node: node8
        fault-injection-methods:                # Failure induction
          - tool: daemon
            nodes: node6
      abort-on-fail: true
